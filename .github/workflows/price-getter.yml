name: price-getter

on:
  schedule:
    - cron: "30 4 * * *" # nightly (UTC); use "30 4 */2 * *" for bi-nightly
  workflow_dispatch:

concurrency:
  group: price-getter
  cancel-in-progress: false # never overlap scrape runs writing the same rows

jobs:
  # Guard the source of truth before any scrape writes to it: a half-migrated
  # production database must abort the run, not corrupt the contract.
  guard:
    name: source-of-truth guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: database/uv.lock

      - name: Verify extensions + tables exist (fails the run if not)
        working-directory: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run scripts/verify_source_of_truth.py

  pull-prices:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # optional: any OpenAI-compatible free provider (Groq / Gemini / OpenRouter)
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: price-getter/uv.lock

      - name: Sync dependencies (incl. embedding model extra)
        working-directory: price-getter
        run: uv sync --extra matching

      - name: Install Playwright browser
        working-directory: price-getter
        run: uv run playwright install --with-deps chromium

      - name: Install virtual display (headed Chromium passes Akamai, headless doesn't)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # Scrapes default to the LOCAL scheduled task (price-getter/scripts/
      # run_nightly.ps1): Akamai blocks GitHub-hosted datacenter IPs at the
      # door — every page 403s within ~60 ms, browser fingerprint irrelevant.
      # Set repo variable ALLOW_GH_SCRAPES=1 to attempt a GH-hosted scrape
      # anyway (only useful behind a residential proxy).
      - name: Run pipeline
        if: vars.ALLOW_GH_SCRAPES == '1'
        working-directory: price-getter
        run: xvfb-run -a uv run price-getter

      - name: Explain why the scrape step is skipped by default
        if: vars.ALLOW_GH_SCRAPES != '1'
        run: |
          echo "Nightly scrapes run LOCALLY: price-getter/scripts/run_nightly.ps1"
          echo "(GitHub Actions datacenter IPs are Akamai-blocked instantly —"
          echo "headless, headed, xvfb, all irrelevant. The IP is the fingerprint.)"
          echo "To override, set repo variable ALLOW_GH_SCRAPES=1."
