[project]
name = "grocery-database"
version = "0.1.0"
description = "Schema of record: Alembic migrations + reference DDL for Postgres (PostGIS + pgvector)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
