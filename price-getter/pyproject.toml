[project]
name = "price-getter"
version = "0.1.0"
description = "Scheduled prong: scrape stores, LLM-parse + normalize prices, write to Postgres. Batch only — the database is its only interface."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "playwright>=1.45",
    "openai>=1.40",
]

[project.optional-dependencies]
# sentence-transformers pulls torch (large) — keep it out of the base install
# and CI; sync with `uv sync --extra matching` to enable embeddings.
matching = ["sentence-transformers>=3.0"]

[project.scripts]
price-getter = "price_getter.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["price_getter"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
